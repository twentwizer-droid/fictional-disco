[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlehunter"
version = "0.1.0"
description = "Solana memecoin bundle analyzer and bundle copy-trading bot (paper trading by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "solders>=0.21",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["anthropic>=2.3"]  # optional AI verdict in `bh check --ai`

[project.scripts]
bh = "bundlehunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bundlehunter = ["webui/*.html", "webui/*.js", "webui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
