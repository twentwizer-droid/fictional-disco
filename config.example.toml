# Copy to config.toml and adjust. Secrets (RPC key, private key) go in .env, not here.
db_path = "data/bundlehunter.db"

[rpc]
# Put your paid RPC URL (Helius / Triton / QuickNode ...) in .env as BH_RPC_URL.
max_concurrency = 8
requests_per_second = 8.0

[analyzer]
early_slots = 3            # launch window = create slot + 3 slots
bundle_min_wallets_per_slot = 3   # early slot with >= 3 buyers is a bundle too (0 = create slot only)
max_mint_sig_pages = 10
max_wallet_sig_pages = 2
max_wallet_txs = 150
min_funding_sol = 0.05     # smaller deposits are dust / address poisoning
quick_funder_sigs = 100    # funder-only lookups (insiders check) skip wallets with longer histories
max_quick_funders = 40
min_create_slot_txs = 3    # auto mode: skip launches with fewer txs in the create slot
min_total_txs = 150        # ...or with too little activity
min_age_s = 1800           # analyze a launch 30 min after creation

[clusters]
hub_funder_max_wallets = 40
ignore_funders = []        # add known CEX hot wallets here
min_co_launches = 2
min_co_jaccard = 0.6
closed_sold_frac = 0.9

[selection]                # which clusters are "in the black"
min_launches = 3
min_closed_launches = 2
min_win_rate = 0.6
min_total_pnl_sol = 3.0
min_median_first_sell_s = 20.0

[strategy]
mode = "dip"               # "dip" (wait for a pullback) or "snipe" (buy immediately)
buy_sol = 0.05
max_open_positions = 3
daily_loss_limit_sol = 0.5
entry_window_s = 600
dip_pct = 0.25
rebound_pct = 0.05
max_entry_vs_bundle = 4.0
abort_if_cluster_sold_pct = 0.15
max_cluster_supply_pct = 0.6
# Axiom-style holder panel, % of supply held now (1.0 = off)
require_holder_panel = true
panel_delay_s = 3.0
panel_refresh_s = 10.0
max_top10_pct = 0.50
max_dev_pct = 0.20
max_snipers_pct = 0.30
max_insiders_pct = 0.30
max_bundlers_pct = 0.50
require_larp_check = true   # narrative / socials / copycat check, runs next to the panel
max_larp_score = 60
exit_on_cluster_sell_pct = 0.10
exit_on_linked_drop_pct = 0.25   # dev+bundlers+insiders hold 25% less than at entry -> exit
take_profit_pct = 1.0
stop_loss_pct = 0.30
trailing_stop_pct = 0.0
max_hold_s = 1200

[execution]
slippage_pct = 5.0            # low: 20-50% gets sandwiched ~18x more than 1-3%
priority_fee_sol = 0.0005
use_jito = true
jito_block_engine = "https://mainnet.block-engine.jito.wtf"   # pick the region closest to your server
jito_tip_sol = 0.001
also_send_rpc = true
paper_slippage_pct = 2.0
paper_fee_pct = 1.25         # pool fee per side
paper_fee_sol = 0.0007       # priority + tip per trade
paper_start_sol = 1.0        # first paper balance
max_stake_pct = 0.25         # one trade <= 25% of the free balance
reserve_sol = 0.02           # always kept for fees
live_max_total_loss_sol = 1.0  # all-time live loss that stops live buying

[feed]
record_launches = true
funder_lookup_on_create = false
fetch_metadata = true       # store every launch's socials so copies can be spotted later

[larp]
ipfs_gateway = "https://ipfs.io/ipfs/"
fetch_website = true
rdap = true                # domain age
fresh_max_txs = 10
famous_handles = ["elonmusk", "realdonaldtrump", "potus", "cz_binance", "binance", "coinbase", "solana",
                  "aeyakovenko", "vitalikbuterin", "saylor", "kanyewest", "openai", "nasa", "spacex", "tesla"]
ai_model = "claude-opus-5-5"   # `bh check --ai`, needs ANTHROPIC_API_KEY and pip install ".[ai]"
ai_effort = "medium"

[narrative]                # bh narrative
dexscreener = true         # search DexScreener too, not only your recorded launches
max_analyze = 10           # tokens analyzed in depth per query
watch_delay_s = 20         # --watch: let the bundle land before analyzing

[scalp]                    # scalping: a 20-60% slice of a move your ranked traders start
enabled = true
buy_sol = 0.1
max_open_positions = 2
min_trader_score = 60      # "smart" wallet = your trader with score >= 60 (bh trader rank / /rank)
strong_trader_score = 80   # one such wallet is reason enough, otherwise...
min_smart_wallets = 2      # ...at least 2 different smart people
entry_window_s = 300       # not confirmed in 5 min -> skip
momentum_window_s = 60
min_buy_volume_sol = 3.0
min_buy_pressure = 1.5     # buys / sells in the window
min_unique_buyers = 5
max_chase_pct = 0.5        # never more than +50% above the smart wallets' entry
max_spike_pct = 0.25       # no entry into a +25% candle (spike_window_s)
spike_window_s = 15
max_larp_score = 60
max_bundlers_pct = 0.30
max_insiders_pct = 0.20
take_profit_max_pct = 0.6  # small position
take_profit_min_pct = 0.2  # position >= size_for_min_tp_sol
size_for_min_tp_sol = 2.0
stop_loss_pct = 0.15
trailing_pct = 0.10        # after half the take profit
max_hold_s = 600
exit_sell_pressure = 1.5   # sells outweigh buys -> the idea is over
exit_on_smart_sell = true
exit_mode = "smart"        # smart | never_lose | fixed
round_trip_cost_pct = 0.06 # live estimate; paper uses the broker's real costs
min_tp_cost_multiple = 3.0 # take profit >= 3x costs
tp1_fraction = 0.5         # share sold at TP1, then stop to break-even
stop_confirm_s = 4.0       # stop must hold this long (no wick-outs)...
emergency_stop_pct = 0.30  # ...except a -30% crash: out at once
runner_trail_pct = 0.25    # trailing once the trade has doubled
never_lose_arm_pct = 0.10  # never_lose: profit beyond costs that locks break-even
never_lose_max_wait_s = 1800
staircase_veto = true
dump_into_smart_veto_pct = 0.30
cooldown_after_loss_s = 600
max_consecutive_losses = 3
pause_after_streak_s = 3600
daily_loss_limit_sol = 0.5
max_trades_per_hour = 6

[signals]                  # signal bot: your traders (/addtrader) + bundle groups in the black
trader_buys = true
trader_sells = true        # only for tokens a buy signal was sent for
min_trader_buy_sol = 0.2
confluence_window_s = 1800 # several of your traders in one token within 30 min = stronger signal
analyze = true             # follow-up with bundle panel + LARP check
bundle_signals = true
trader_history_txs = 400   # history loaded when you add a trader (for PnL)

[telegram]                 # token / allowed ids are in .env
notify_trades = true       # message on every buy and sell

[web]
enabled = true
host = "127.0.0.1"         # Docker sets 0.0.0.0 inside the container; then BH_WEB_PASSWORD is required
port = 8080

[auto]
analyze_every_s = 300
analyze_batch = 20
rebuild_clusters_every_s = 900
