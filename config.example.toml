# Copy to config.toml and adjust. Secrets (RPC key, private key) go in .env, not here.
db_path = "data/bundlehunter.db"

[rpc]
# Put your paid RPC URL (Helius / Triton / QuickNode ...) in .env as BH_RPC_URL.
max_concurrency = 8
requests_per_second = 8.0

[analyzer]
early_slots = 3            # launch window = create slot + 3 slots
bundle_min_wallets_per_slot = 3   # early slot with >= 3 buyers is a bundle too (0 = create slot only)
max_mint_sig_pages = 10
max_wallet_sig_pages = 2
max_wallet_txs = 150
min_funding_sol = 0.05     # smaller deposits are dust / address poisoning
quick_funder_sigs = 100    # funder-only lookups (insiders check) skip wallets with longer histories
max_quick_funders = 40
min_create_slot_txs = 3    # auto mode: skip launches with fewer txs in the create slot
min_total_txs = 150        # ...or with too little activity
min_age_s = 1800           # analyze a launch 30 min after creation

[clusters]
hub_funder_max_wallets = 40
ignore_funders = []        # add known CEX hot wallets here
min_co_launches = 2
min_co_jaccard = 0.6
closed_sold_frac = 0.9

[selection]                # which clusters are "in the black"
min_launches = 3
min_closed_launches = 2
min_win_rate = 0.6
min_total_pnl_sol = 3.0
min_median_first_sell_s = 20.0

[strategy]
mode = "dip"               # "dip" (wait for a pullback) or "snipe" (buy immediately)
buy_sol = 0.05
max_open_positions = 3
daily_loss_limit_sol = 0.5
entry_window_s = 600
dip_pct = 0.25
rebound_pct = 0.05
max_entry_vs_bundle = 4.0
abort_if_cluster_sold_pct = 0.15
max_cluster_supply_pct = 0.6
# Axiom-style holder panel, % of supply held now (1.0 = off)
require_holder_panel = true
panel_delay_s = 3.0
panel_refresh_s = 10.0
max_top10_pct = 0.50
max_dev_pct = 0.20
max_snipers_pct = 0.30
max_insiders_pct = 0.30
max_bundlers_pct = 0.50
require_larp_check = true   # narrative / socials / copycat check, runs next to the panel
max_larp_score = 60
exit_on_cluster_sell_pct = 0.10
exit_on_linked_drop_pct = 0.25   # dev+bundlers+insiders hold 25% less than at entry -> exit
take_profit_pct = 1.0
stop_loss_pct = 0.30
trailing_stop_pct = 0.0
max_hold_s = 1200

[execution]
slippage_pct = 15.0
priority_fee_sol = 0.0005
use_jito = true
jito_block_engine = "https://mainnet.block-engine.jito.wtf"   # pick the region closest to your server
jito_tip_sol = 0.001
also_send_rpc = true
paper_slippage_pct = 3.0

[feed]
record_launches = true
funder_lookup_on_create = false
fetch_metadata = true       # store every launch's socials so copies can be spotted later

[larp]
ipfs_gateway = "https://ipfs.io/ipfs/"
fetch_website = true
rdap = true                # domain age
fresh_max_txs = 10
famous_handles = ["elonmusk", "realdonaldtrump", "potus", "cz_binance", "binance", "coinbase", "solana",
                  "aeyakovenko", "vitalikbuterin", "saylor", "kanyewest", "openai", "nasa", "spacex", "tesla"]
ai_model = "claude-opus-5-5"   # `bh check --ai`, needs ANTHROPIC_API_KEY and pip install ".[ai]"
ai_effort = "medium"

[narrative]                # bh narrative
dexscreener = true         # search DexScreener too, not only your recorded launches
max_analyze = 10           # tokens analyzed in depth per query
watch_delay_s = 20         # --watch: let the bundle land before analyzing

[auto]
analyze_every_s = 300
analyze_batch = 20
rebuild_clusters_every_s = 900
